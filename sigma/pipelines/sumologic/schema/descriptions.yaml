related_attributes:
  dns_query: The full DNS query of which the query domain may be an element
  dns_queryType: DNS query type is an element of the full DNS query
  dns_replyDomain: May be the same domain as the query domain, but is only seen upon reply to a query
  user_authDomain: Distinct from a DNS query or reply domain, the authDomain is for authentication logs not DNS. 
