field_name: dns_query
population_method: mapping
type: string    
entity_type: 
enrichment_attribute: false
description: |-
 The entire DNS request made from the client machine to the DNS server.
example_usage:
- DNS:
    example_pairs:
      Query: subdomain.domain.tld IN A + (1.2.3.4)
    example_values:
      - 1.1.1.1.in-addr.arpa IN PTR + (1.2.3.4)
      - 1.2.3.in-addr.arpa IN SOA -SE (1.2.3.4)
related_attributes:
  dns_queryDomain: An element of the full DNS query if the query contains a domain
  dns_queryType: DNS query type is an element of the full query
  dns_returnCode: The message or code outcome of the query
---
field_name: dns_queryDomain
population_method: mapping
