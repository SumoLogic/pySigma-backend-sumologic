population_method: mapping
type: string
entity_type: mac
enrichment_attribute: false
description: |-
 The media access control (MAC) ID of the device that generated the log message. Common examples include, but are not limited to, the endpoint reporting an infection or the network appliance reporting allowed or blocked network traffic. 
 In cases where the log data has a source or destination context, there are situations where identical data is populated in one of those fields and this field. An example would be authentication logs from a firewall. The device_mac would be the same as the dstDevice_mac because the firewall is reporting a network authentication log about itself.
example_usage:
 - Network:
    example_keys:
      - Device_mac
      - Devicemac
      - Dvcmac
      - Macaddr
      - Mac_address
      - mac
 - Endpoint:
    example_keys:
      - Endpoint_mac
      - Device_mac
      - dvcmac
      - Macaddr
      - Mac_address
      - mac
 - Operating System:
    example_keys:
      - endpoint_mac
      - macaddr
      - Host_mac
      - mac
related_attributes:
  device_hostname: The hostname associated with the device_mac
  device_ip: The IP address associated with the device_mac
  device_natIp: The network address translated IP address associated with the device_mac
  device_osName: The operating system present on the device with the device_mac
---
field_name: device_natIp
population_method: mapping
type: string
entity_type: ip
enrichment_attribute: true
description: |-
 The external network address translated (NAT) IP address of the device that generated the log message. Common examples include, but are not limited to, the endpoint reporting an infection or the network appliance reporting allowed or blocked network traffic. 
 In cases where the log data has a source or destination context, there are situations where identical data is populated in one of those fields and this field. An example would be authentication logs from a firewall. The device_natIp would be the same as the dstDevice_natIp because the firewall is reporting a network authentication log about itself.
example_usage:
 - Network:
    example_keys:
      - nat_ip
      - Device_natIP
      - DevNATip
      - client_natIP
      - destinationTranslatedAddress
 - Endpoint:
    example_keys:
      - Device_natIP
      - natIP
related_attributes:
  device_hostname: The hostname which the device_natIP resolves as.
  device_mac: The physical address for the device with the device_natIP
  device_natIp: The network address translated IP address of the device_natIP
  device_osName: The operating system present on the device with the device_natIP
---
field_name: device_osName   
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The operating system name present on the computer that generated the log message. Common examples include, but are not limited to, the endpoint reporting an infection or the network appliance reporting allowed or blocked network traffic. 
 In cases where the log data has a source or destination context, there are situations where identical data is populated in one of those fields and this field. An example would be authentication logs from a firewall. The device_osName would be the same as the dstDevice_osName because the firewall is reporting a network authentication log about itself.
example_usage:
 - Network:
    example_keys:
      - osName
      - ClientOSVersion
 - Endpoint:
    example_keys:
      - OS_MAJOR_VERSION
      - os_version
      - device_version
 - Other:
    example_keys:
      - Operating_System
      - AD-Operating-System
      - os
related_attributes:
  http_userAgent: A user agent string may contain the operating system name of a device, but a user agent string contains additional information related to a device requesting information via the web and http_userAgent is intended for that purpose alone. Device_osName is similarly only intended to capture the operating system name of a given device.
  device_hostname: The hostname of the device which the device_osName is associated with
  device_ip: The IP address of the device which the device_osName is associated with
  device_mac: The physical address for the device associated with the device_osName
  device_natIp: The network address translated IP address of the device which the device_osName is associated with
---
field_name: device_uniqueId 
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The vendor or product specific identifier for a computer that generated the log message. Common examples include, but are not limited to, the endpoint reporting an infection or the network appliance reporting allowed or blocked network traffic. This field is also frequently used by cloud providers to identify instances.
 In cases where the log data has a source or destination context, there are situations where identical data is populated in one of those fields and this field. An example would be authentication logs from a firewall. The device_mac would be the same as the dstDevice_mac because the firewall is reporting a network authentication log about itself.
example_usage:
 - Cloud:
    example_keys:
      - instanceId
      - tenantId
      - organizationId
 - Endpoint:
    example_keys:
      - infected.device.id
      - Device_id
      - resourceId
related_attributes:
  device_hostname: A unique ID may refer to a hostname, but is typically generated by a product and assigned to a device.
  device_ip: A unique ID may refer to a host IP, but is typically generated by a product and assigned to a device.
  device_mac: A unique ID may refer to a device's specific MAC address, but is typically generated by a product and assigned to a device.
