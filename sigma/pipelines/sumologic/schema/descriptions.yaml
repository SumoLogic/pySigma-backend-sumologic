---
field_name: accountId
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 A unique identifier tied to an organizational account, such as a tenant. Common with cloud services where sub-accounts or multiple tenants can be present. Not to be used as a user account identifier.
example_usage:
 - Cloud:
    example_pairs:
      AWS AccountID: 123456789012
      Azure TenantID: ef3a83b9-3c2f-44fd-a9c5-36b382e3bfdf
      Google Org ID: 34739118321
related_attributes:
  resource: Account may be a resource in certain contexts, such as when an accounts attributes are being acted upon administratively. Resource may also refer to a resource running under an account within a cloud environment.
  cloud_provider: The accountId may refer to an account within a specific cloud provider.
---
field_name: action  
population_method: mapping
type: string    
entity_type: 
enrichment_attribute: false
description: |-
 Action summarizes an operation undertaken by a device or user and recorded in a log.
example_usage:
 - Firewalls:
    example_values:
      - Allow
      - Block
      - Accept
      - Deny
 - Antivirus:
    example_values: 
      - Scanned
      - Quarantined
      - Cleaned
      - Deleted
 - Email:
    example_values: 
      - Sent
      - Received
      - Mark as Spam
      - Delete
 - Audit:
    example_values: 
      - Access Granted
      - Access Denied
      - Log On
      - Log Off
      - User Added
      - Group Added
      - User Removed
      - Group Removed
      - Policy Add
      - Policy Removed
      - Policy Updated
related_attributes:
  commandLine: Action may be the sum result of an executed command, or it may describe the attempt, not necessarily the result. An action carried out via command line, or a failed attempt to perform an action via command line.
  changeType: Action may capture audit activities. Add, remove, and update as types of actions within an audit context.
  description: Description and action may be synonymous. As the description explains the event a log captures, the event described may be an action taken.
  success: This boolean result may represent the outcome of an action taken. Log on success, where log on is the action and success is true.
---
field_name: Application
population_method: mapping
type: string    
entity_type: 
enrichment_attribute: false
description: |-
 A service or software application referenced in a log indicating its execution, presence, or as context for a given event.
example_usage:
 - Audit:
      example_values: 
      - Scheduled Task
      - Installed/Uninstalled 
      - Microsoft Office Word
 - Application Layer Services:
      example_values:
      - HTTP
      - SMTP
      - FTP
      - DHCP
 - Authentication:
      example_values:
      - Logon Process/Service
 - Cloud:
      example_keys:
      - AWS eventSource
      - ecr, s3, ec2, iam
      - Azure Target Resource Name
      - User defined applications
related_attributes:
  baseImage: A process image may be an application independently or a component of an application, but baseImage is reserved for specific executable processes (e.g sysmon.exe), where application is a broader descriptor.
---
field_name: baseImage
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The name of an executable process. Often found in process auditing and malware detection events.
example_usage:
 - Audit:
    example_values:
      - notepad.exe
      - cmd.exe
      - powershell.exe
      - ssh
      - iTerm2
 - Endpoint:
    example_values:
      - qweelknlkoiweube.exe (a suspicious process)
related_attributes:
  application: A process image may be an application independently or a component of an application, but baseImage is reserved for specific executable processes (e.g sysmon.exe), where application is a broader descriptor.
  threat_name: A threat name usually describes a specific signature of attack or malware (e.g, conficker.c). A base image may serve as the delivery mechanism for a threat, but the actual threat name would most likely be distinct from the base image.
  parentBaseImage: Parent base image is the process which spawned this process.
  grandparentBaseImage: Grandparent base image is the process which spawned the parent process.
---
field_name: bytesIn
population_method: mapping
type: long  
entity_type: 
enrichment_attribute: false
description: |-
 Amount of data received in bytes
example_usage:
 - Network:
    example_keys:
      - bytesIn
      - in
      - received
      - bytes_received
      - rcvdbyte
      - srcBytes
related_attributes:
  file_size: File size may be the sum of received bytes such as in a file download.
---
field_name: bytesOut
population_method: mapping
type: long  
entity_type: 
enrichment_attribute: false
description: |-
 Amount of data sent in bytes
example_usage:
 - Network:
    example_keys:
      - bytesOut
      - out
      - sent
      - bytes_sent
      - sentbyte
      - dstBytes
related_attributes:
  file_size: File size may be the sum of sent bytes such as in a file upload.
---
field_name: changeTarget
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The user, group, policy or other resource which is to be or has been modified, deleted, or created.
example_usage:
 - Cloud:
     example_pairs:
      Azure Audit: user added to a group, created user, member added to role
      AWS Cloudtrail: The trail deleted, created or modified
      AWS IAM: The IAM managed policy deleted, the user for which a IAM managed policy was added/deleted
 - User and Group Management:
    example_values:
      - The user created
      - The user deleted
      - The user account locked/unlocked
      - The group modified
 - Firewall/Proxy:
    example_values:
      - The ACL added
      - The ACL deleted
      - The ACL modified
      - The policy added
      - The policy deleted
      - The policy modified
related_attributes:
  changeType: Describes the nature of the modification performed or to be performed (modify, delete, create) and often the category of the object acted upon (user, group, policy, or other resource).
  user_username: A user may be the target of a change, but in this case username would be the user initiating the change, while the user being modified, created, or deleted is the change target.
---
field_name: changeType
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The nature of the modification (modify, delete, create) and often the category of the object to be acted upon (user, group, policy, or other resource).
example_usage:
 - Cloud:
    example_pairs:
      Azure Audit: Add member to role, create user, conditional access policy modified
      AWS Cloudtrail: Trail deleted, added, or modified
      AWS IAM: IAM policy deleted, IAM policy added to user
 - User and Group Management:
    example_values:
      - User created
      - User deleted
      - User account locked/unlocked
      - Group modified
 - Firewall/Proxy:
    example_values:
      - ACL added
      - ACL deleted
      - ACL modified
      - Policy added
      - Policy deleted
      - Policy modified
related_attributes:
  changeTarget: The user, group, policy, or other resource to be acted upon in the manner described by changeType.
  description: This may overlap with changeType, but description is more generalized. Description provides a summary of the high level meaning of log in a typically human readable form.
  success: This boolean result may represent the outcome of a change. User create success, where User create is the changeType and success is true
---
field_name: commandLine
population_method: mapping
type: string    
entity_type: 
enrichment_attribute: false
description: |-
 The instruction or set of instructions inputted into a text interface such as the command prompt (cmd.exe) or PowerShell in Windows, or terminal on Unix based systems.
example_usage:
 - Windows (cmd, PowerShell):
    example_values:
      - ipconfig /all
      - netsh interface ip add dns "connection name" 208.67.222.222
      - Add-ADGroupMember -Identity SvcAccPSOGroup -Members SQL01,SQL02
 - Terminal:
    example_values:
      - ssh testuser@10.0.0.55
      - chmod u+r,g+x filename>
related_attributes:
  parentCommandLine: In some instances another process may have an associated command line that is used to create child processes and command lines. This would be associated with a parentBaseImage.
  grandparentCommandLine: The command line associated with the grandparent process that spawned the parent process.
  baseImage: Often commandLine will contain the process executing the instructions as well as arguments, the complete string should be captured into commandLine.
---
field_name: description
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The summary conveying the high level meaning of a log message in a human readable form. In some circumstances no summary is provided in the log, this field is often manually defined in the mapping as a constant or as a lookup based on event IDs in the log message.
example_usage:
 - General:
    example_keys:
      - event_name
      - name
      - message
      - msg
      - description
      - title
      - Detail
      - activity
      - operationName
      - resultReason
      - type
related_attributes:
  action: Since description summarizes an event, the action may also be captured within description. Description is typically more verbose than action.
  changeType: Since description summarizes an event, changeType may also be captured within description. Description is typically more verbose than changeType.
  success: The boolean success may relate to description in that it summarizes the outcome in a log as true or false.
---
field_name: device_hostname 
population_method: mapping
type: string
entity_type: hostname
enrichment_attribute: false
description: |-
 The computer name that generated the log message. Common examples include, but are not limited to, the endpoint reporting an infection or the network appliance reporting allowed or blocked network traffic. 
 In cases where the log data has a source or destination context, there are situations where identical data is populated in one of those fields and this field. An example would be authentication logs from a firewall. The device_hostname would be the same as the dstDevice_hostname because the firewall is reporting a network authentication log about itself.
example_usage:
 - Network:
    example_keys:
      - Appliance
      - Device_name
      - Hostname
      - Devname
 - Endpoint:
    example_keys:
      - Endpoint
      - Device_name
      - Hostname
 - Operating System:
    example_keys:
      - Computer
      - serverName
      - endpoint_hostname
      - Hostname
      - host_name
related_attributes:
  device_ip: The IP address which the device_hostname resolves to
  device_mac: The physical address for the device_hostname
  device_natIp: The network address translated IP address of the device_hostname
  device_osName: The operating system present on the device_hostname
---
field_name: device_ip   
population_method: mapping
type: string
entity_type: ip
enrichment_attribute: true
description: |-
 The internet protocol (IP) address of a computer that generated the log message. Common examples include, but are not limited to, the endpoint reporting an infection or the network appliance reporting allowed or blocked network traffic. 
 In cases where the log data has a source or destination context, there are situations where identical data is populated in one of those fields and this field. An example would be authentication logs from a firewall. The device_ip would be the same as the dstDevice_ip because the firewall is reporting a network authentication log about itself.
example_usage:
 - Network:
    example_keys:
      - Appliance
      - Device_ip
      - DeviceIp
      - Devip
      - client_ip
 - Endpoint:
    example_keys:
      - Endpoint
      - Device_ip
      - IP
 - Operating System:
    example_keys:
      - Computer
      - serverip
      - Endpoint_ip
      - client_ip
      - ip
      - Host_ip
      - Workstation
      - Server
related_attributes:
  device_hostname: The hostname which the device_ip resolves as.
  device_mac: The physical address for the device with the device_ip
  device_natIp: The network address translated IP address of the device_ip
  device_osName: The operating system present on the device with the device_ip
