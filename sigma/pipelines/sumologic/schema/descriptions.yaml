field_name: parentBaseImage
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 The name of an executable process which has spawned a child process. Often found in process auditing and malware detection events.
example_usage:
 - Audit:
    example_keys:
      - cmd.exe
      - powershell.exe
      - ssh
      - iTerm2
 - Endpoint:
    example_keys:
      - qweelknlkoiweube.exe (a suspicious process)
related_attributes:
  application: A process image may be an application independently or a component of an application, but parentBaseImage is reserved for specific executable processes (e.g sysmon.exe), where application is a broader descriptor.
  threat_name: A threat name usually describes a specific signature of attack or malware (e.g, conficker.c). A base image may serve as the delivery mechanism for a threat, but the actual threat name would most likely be distinct from the base image.
  baseImage: Base image is the child process of the parent which spawned it.
  grandparentBaseImage: Grandparent base image is the process which spawned the parent process.
---
field_name: grandparentBaseImage
population_method: mapping
type: string
entity_type:
enrichment_attribute: false
description: |-
 The name of an executable process which spawned the parent process. Often found in process auditing and malware detection events.
example_usage:
 - Audit:
    example_keys:
      - cmd.exe
      - powershell.exe
      - ssh
      - iTerm2
 - Endpoint:
    example_keys:
      - qweelknlkoiweube.exe (a suspicious process)
related_attributes:
  parentBaseImage: Parent base image is the child process of the grandparent which spawned it.
  baseImage: Base image is the grandchild process of the grandparent.
---
field_name: parentCommandLine
population_method: mapping
type: string    
entity_type: 
enrichment_attribute: false
description: |-
 The instruction or set of instructions inputted into a text interface such as the command prompt (cmd.exe) or PowerShell in Windows, or terminal on Unix based systems associated with a parent process.
example_usage:
 - Windows (cmd, PowerShell):
    example_values:
      - ipconfig /all
      - netsh interface ip add dns "connection name" 208.67.222.222
      - Add-ADGroupMember -Identity SvcAccPSOGroup -Members SQL01,SQL02
 - Terminal:
    example_values:
      - ssh testuser@10.0.0.55
      - chmod u+r,g+x filename
related_attributes:
  commandLine: In some instances another process may have an associated command line that is used to create child processes and command lines. This would be associated with a parentBaseImage.
  grandparentCommandLine: The command line associated with the grandparent process that spawned the parent process.
  parentBaseImage: Often parentCommandLine will contain the process executing the instructions as well as arguments, the complete string should be captured into parentCommandLine.
---
field_name: grandparentCommandLine
population_method: mapping
type: string
entity_type:
enrichment_attribute: false
description: |-
 The instruction or set of instructions inputted into a text interface such as the command prompt (cmd.exe) or PowerShell in Windows, or terminal on Unix based systems associated with a grandparent process.
example_usage:
 - Windows (cmd, PowerShell):
    example_values:
      - ipconfig /all
      - netsh interface ip add dns "connection name" 208.67.222.222
      - Add-ADGroupMember -Identity SvcAccPSOGroup -Members SQL01,SQL02
 - Terminal:
    example_values:
      - ssh testuser@10.0.0.55
      - chmod u+r,g+x filename
related_attributes:
  parentCommandLine: The command line of the parent process, which is a child of the grandparent process.
  grandparentBaseImage: Often grandparentCommandLine will contain the process executing the instructions as well as arguments, the complete string should be captured into grandparentCommandLine.
---
field_name: parentPid
population_method: mapping
type: int
entity_type: 
enrichment_attribute: false
description: |-
 The process id of the program that initiated a process (typically the parentBaseImage).
example_usage:
 - Endpoint:
    example_keys:
      - parentPid
      - Process_id
      - Parent.pid
      - parentProcessId
related_attributes:
  pid: Pid (process id) would be used in the absence of a logged parent process spawning it.
  grandparentPid: Grandparent PID (process ID) is the process that spawned the parent process.
---
field_name: grandparentPid
population_method: mapping
type: int
entity_type:
enrichment_attribute: false
description: |-
 The process id of the program that initiated the parent process (typically the grandparentBaseImage).
example_usage:
 - Endpoint:
    example_keys:
      - grandparentPid
      - GrandParent.pid
      - grandparentProcessId
related_attributes:
  parentPid: Parent PID (process ID) is the child of the grandparent process.
  pid: Pid (process id) is the grandchild of the grandparent process.
---
field_name: pid
population_method: mapping
type: int
entity_type: 
enrichment_attribute: false
description: |-
 The process id of a process (typically the baseImage).
example_usage:
 - Endpoint:
    example_keys:
      - pid
      - Process_id
      - ProcessId
related_attributes:
  parentPid: Parent PID (process ID) would be present in cases where the process was created by another.
  grandparentPid: Grandparent PID (process ID) would be present in cases where the parent process was created by another.
---
field_name: processUid
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 A data source specific unique identifier for a process, often a GUID.
example_usage:
 - General:
    example_keys:
      - Process_guid
      - ProcessUid
related_attributes:
  pid: Process IDs are most often not unique and are often reused. A process UID should be a unique identifier.
---
field_name: repository
population_method: mapping
type: string
entity_type: file
enrichment_attribute: False
description: |-
 The name or path of a centrally managed object storage location, such as a Git repository, a container repository, or similar concepts.
example_usage:
  - Git:
    example_keys:
      - repo
      - repository
related_attributes:
  resource: Depending on the context of the log, the resource being acted upon or referenced may be a repository as well
  resourceType: Repository may be the type of a resource referenced in a log
  normalizedResource: Repository is a normalizedResource, this is used when the resource referenced in the log is a repository and is central to classifying the log message as a whole
---
field_name: resource
population_method: mapping
type: string
entity_type: resource
enrichment_attribute: false
description: |-
 Generalized field to capture an object referenced within a log that does not have a more specific field currently specified in the mapping schema. (e.g. a file is a resource, however file_basename and file_path both exist to capture this value)
example_usage:
 - General:
    example_keys:
      - ARN
      - resourceTitle
      - RESOURCE_NAME
      - SessionName
      - ShareName
related_attributes:
 resourceType: Describes at a higher level
 normalizedResource: If the resource captured maps to the enumerated values in normalizedResource so it can be more broadly correlated and classified.
 Note: As a general usage field, resource can be associated with any other field which is more specific in purpose. More specific fields should always be used if there is one available for capturing data.
---
field_name: resourceType
population_method: mapping
type: string
entity_type: 
enrichment_attribute: false
description: |-
 Generalized field to help describe the nature of a resource. Used when a resource exists for which there is no more specific field specified for that type of resource. (e.g. a file is a type of resource, file_basename exists to capture the name of the file and describes the type)
example_usage:
 - General:
    example_keys:
      - message.data.resource.type  
related_attributes:
 resource: The associated specific resource which the resource type describes
 normalizedResource: The normalized resource provides an enumerated list of common resource types. This may overlap, and resourceType may be used as a lookup to map into normalizedResource.
 Note: As a general usage field, resourceType may often be redundant if a more strongly typed field exists. A file could be the type of resource, but file_basename for example describes the file resource as a file type.
