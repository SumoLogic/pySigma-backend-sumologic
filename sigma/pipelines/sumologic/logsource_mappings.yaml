# Sumo Logic Cloud SIEM (CSE) — Unified Logsource Mappings
#
# This file consolidates two data sources:
#   1. Vendor/product metadata (LOGSOURCE_TO_VENDOR_PRODUCT)
#   2. Pipeline ProcessingItem field mappings
#
# Each entry may contain:
#   - logsource:       Sigma logsource match conditions (product/service/category)
#   - vendor:          CSE metadata_vendor value
#   - product_name:    CSE metadata_product value
#   - pattern_type:    Parser pattern: concatenation | simple | constant | transform
#   - classification:  Source class: endpoint | identity | cloud_audit | network |
#                      application | cloud_infrastructure | security_tool
#   - fields:          Sigma field → CSE schema field mappings
#
# Order matters for entries with `fields` — it defines pipeline processing priority.

mappings:

  # ===========================================================================
  # CATEGORY-BASED FIELD MAPPINGS (no product restriction)
  # ===========================================================================

  - name: process_creation
    logsource:
      category: process_creation
    fields:
      CommandLine: commandLine
      Image: baseImage
      ParentImage: parentBaseImage
      ParentCommandLine: parentCommandLine
      ProcessId: pid
      ParentProcessId: parentPid
      CurrentDirectory: file_path
      OriginalFileName: file_basename
      User: user_username
      LogonId: sessionId
      IntegrityLevel: severity
      md5: file_hash_md5
      MD5: file_hash_md5
      sha1: file_hash_sha1
      SHA1: file_hash_sha1
      sha256: file_hash_sha256
      SHA256: file_hash_sha256
      Hashes: file_hash_sha256
      imphash: file_hash_imphash
      ProcessGuid: processUid
      Description: description

  - name: network_connection
    logsource:
      category: network_connection
    fields:
      SourceIp: srcDevice_ip
      SourcePort: srcPort
      DestinationIp: dstDevice_ip
      DestinationPort: dstPort
      Protocol: ipProtocol
      Image: baseImage
      User: user_username
      ProcessId: pid
      Initiated: action
      DestinationHostname: dstDevice_hostname
      SourceHostname: srcDevice_hostname
      source.ip: srcDevice_ip
      source.port: srcPort
      destination.ip: dstDevice_ip
      destination.port: dstPort
      network.transport: ipProtocol
      network.protocol: application
      source.bytes: bytesOut
      destination.bytes: bytesIn
      source.packets: packetsOut
      destination.packets: packetsIn

  - name: dns_query
    logsource:
      category: dns_query
    fields:
      QueryName: dns_query
      QueryResults: dns_reply
      QueryStatus: dns_replyCode
      Image: baseImage
      ProcessId: pid
      record_type: dns_queryType

  - name: dns
    logsource:
      category: dns
    fields:
      query: dns_query
      record_type: dns_queryType
      rcode: dns_replyCode
      dns.question.name: dns_query
      dns.question.type: dns_queryType
      dns.response.code: dns_replyCode
      dns.answers.name: dns_reply
      dns.answers.data: dns_replyIp
      dns.answers.ttl: dns_replyTtl
      source.ip: srcDevice_ip
      source.port: srcPort
      destination.ip: dstDevice_ip
      destination.port: dstPort

  - name: file_event
    logsource:
      category: file_event
    fields:
      TargetFilename: file_path
      Image: baseImage
      User: user_username
      ProcessId: pid
      md5: file_hash_md5
      sha1: file_hash_sha1
      sha256: file_hash_sha256

  - name: image_load
    logsource:
      category: image_load
    fields:
      ImageLoaded: file_path
      Signature: threat_identifier
      Image: baseImage
      md5: file_hash_md5
      sha1: file_hash_sha1
      sha256: file_hash_sha256
      imphash: file_hash_imphash

  - name: registry_event
    logsource:
      category: registry_event
    fields:
      TargetObject: changeTarget
      EventType: changeType
      Image: baseImage
      User: user_username

  - name: antivirus
    logsource:
      category: antivirus
    vendor: "Generic"
    product_name: "Antivirus"
    pattern_type: simple
    classification: security_tool
    fields:
      Signature: threat_identifier
      signature: threat_identifier
      Filename: file_path
      FileName: file_path
      filename: file_path
      Action: action
      action: action
      Computer: device_hostname
      User: user_username
      ThreatName: threat_identifier
      Malware: threat_identifier

