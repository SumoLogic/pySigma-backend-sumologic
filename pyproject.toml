[tool.poetry]
name = "pysigma-backend-sumologic"
version = "0.2.0"
description = "pySigma Sumo Logic Cloud SIEM backend with confidence scoring"
authors = ["Dinesh Meka <dinesh.meka@sumologic.com>"]
license = "LGPL-3.0-only"
repository = "https://github.com/SumoLogic/pySigma-backend-sumologic"
packages = [
    { include = "sigma" }
]

# Include schema file in distribution
include = [
    "sigma/pipelines/sumologic/schema/descriptions.yaml",
    "sigma/pipelines/sumologic/logsource_mappings.yaml"
]

[tool.poetry.dependencies]
python = "^3.10"
pysigma = "^1.0"
defusedxml = "^0.7.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.0"
coverage = "^7.0"
streamlit = "^1.32.0"
black = "^24.0"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
